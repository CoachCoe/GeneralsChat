name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: generalschat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The database name must contain "test": e2e/global-setup.ts refuses to
      # reset anything else, so a misconfigured secret cannot wipe real data.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/generalschat_test?schema=public
      # Not a secret — this database and this server exist only for this run.
      AUTH_SECRET: ci-only-secret-not-used-outside-this-job
      AUTH_TRUST_HOST: 'true'
      # Anthropic calls are served by the local stub started in global-setup,
      # so the suite makes no billed API calls and needs no real key.
      ANTHROPIC_API_KEY: stub-key-not-used
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
