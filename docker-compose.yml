# Local development stack.
#
# Previously this file could not start the app at all: DATABASE_URL was a
# SQLite path while the Prisma datasource is postgresql, there was no database
# service of any kind, ANTHROPIC_API_KEY (the only key the app actually needs)
# was never passed in, and it provisioned an Ollama container for a code path
# that no longer exists. The whole repo was also bind-mounted over /app,
# discarding the image build. (REPO-15, SEC-14, REPO-3)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: generalschat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d generalschat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrations run to completion before the app starts, the same ordering the
  # Azure deploy uses. The app image is lean and carries no Prisma CLI.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/generalschat?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/generalschat?schema=public
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set}"
      # Quoted: the message contains ': ', which makes an unquoted value invalid
      # YAML. This file had never parsed, so `docker compose up` had never run.
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set - generate with openssl rand -base64 32}"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      # Optional: enables vector search instead of the keyword fallback.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_URL: ${CHROMA_URL:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data:
